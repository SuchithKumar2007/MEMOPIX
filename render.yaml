services:
  - type: web
    name: memopix-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node --max-old-space-size=400 dist/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://memopix-tau.vercel.app
      - key: STORAGE_LIMIT_BYTES
        value: "5000000000000"
      - key: JWT_EXPIRES_IN
        value: 7d
