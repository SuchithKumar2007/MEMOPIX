<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="60%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- PIX Word Gradient -->
    <linearGradient id="pixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>


    <linearGradient id="swirlGrad0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <linearGradient id="swirlGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
    <linearGradient id="swirlGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="swirlGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="swirlGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>
    <linearGradient id="swirlGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="swirlGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="swirlGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="lensClip">
      <circle cx="0" cy="0" r="116" />
    </clipPath>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="76" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="75" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Soft Ambient Glow behind Aperture -->
  <circle cx="256" cy="180" r="135" fill="#3B82F6" opacity="0.18" filter="url(#softGlow)" />

  <!-- Outer Glowing Thin Ring -->
  <circle cx="256" cy="180" r="120" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.9" />

  <!-- ==================== APERTURE SHUTTER LENS ==================== -->
  <g transform="translate(256, 180)">
    <!-- Base dark background of the lens -->
    <circle cx="0" cy="0" r="116" fill="#080D1A" />

    <!-- Clipped Blades -->
    <g clip-path="url(#lensClip)">
    <path d="M 0.00,-116.00 A 116,116 0 0,1 82.02,-82.02 L -16.99,-40.59 L -40.71,-16.69 Z" fill="url(#swirlGrad0)" stroke="#080D1A" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 82.02,-82.02 A 116,116 0 0,1 116.00,0.00 L 16.69,-40.71 L -16.99,-40.59 Z" fill="url(#swirlGrad1)" stroke="#080D1A" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 116.00,0.00 A 116,116 0 0,1 82.02,82.02 L 40.59,-16.99 L 16.69,-40.71 Z" fill="url(#swirlGrad2)" stroke="#080D1A" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 82.02,82.02 A 116,116 0 0,1 0.00,116.00 L 40.71,16.69 L 40.59,-16.99 Z" fill="url(#swirlGrad3)" stroke="#080D1A" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 0.00,116.00 A 116,116 0 0,1 -82.02,82.02 L 16.99,40.59 L 40.71,16.69 Z" fill="url(#swirlGrad4)" stroke="#080D1A" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M -82.02,82.02 A 116,116 0 0,1 -116.00,0.00 L -16.69,40.71 L 16.99,40.59 Z" fill="url(#swirlGrad5)" stroke="#080D1A" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M -116.00,0.00 A 116,116 0 0,1 -82.02,-82.02 L -40.59,16.99 L -16.69,40.71 Z" fill="url(#swirlGrad6)" stroke="#080D1A" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M -82.02,-82.02 A 116,116 0 0,1 -0.00,-116.00 L -40.71,-16.69 L -40.59,16.99 Z" fill="url(#swirlGrad7)" stroke="#080D1A" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Center Dark Aperture Opening Polygon -->
      <polygon points="-16.99,-40.59 16.69,-40.71 40.59,-16.99 40.71,16.69 16.99,40.59 -16.69,40.71 -40.59,16.99 -40.71,-16.69" fill="#080D1A" stroke="#080D1A" stroke-width="2" />
    </g>

    <!-- Center White Cloud Icon with soft glow -->
    <g transform="translate(0, -2)">
      <path d="M -20,6 A 10,10 0 0,0 -7,11 L 16,11 A 12,12 0 0,0 18,-12 A 16,16 0 0,0 -10,-14 A 12,12 0 0,0 -20,6 Z" fill="#FFFFFF" filter="drop-shadow(0 0 10px rgba(56,189,248,0.75))" />
    </g>
  </g>

  <!-- ==================== DIGITAL MEMORY PIXELS (Top-Right) ==================== -->
  <g>
    <!-- Pink pixel -->
    <rect x="366" y="70" width="18" height="18" rx="4" fill="#E879F9" opacity="0.95" />
    <!-- Blue square -->
    <rect x="394" y="88" width="20" height="20" rx="4" fill="#2563EB" opacity="0.9" />
    <!-- Sky blue square -->
    <rect x="370" y="104" width="17" height="17" rx="3.5" fill="#0284C7" opacity="0.95" />
    <!-- Bright cyan square -->
    <rect x="396" y="122" width="16" height="16" rx="3.5" fill="#00E5FF" opacity="0.9" />
    <!-- Purple square -->
    <rect x="426" y="108" width="18" height="18" rx="4" fill="#9333EA" opacity="0.95" />
    <!-- Magenta small square -->
    <rect x="382" y="138" width="15" height="15" rx="3.5" fill="#C084FC" opacity="0.9" />
  </g>

  <!-- ==================== TYPOGRAPHY (Crystal-Clear Text) ==================== -->
  <!-- "MEMOPIX" -->
  <g transform="translate(256, 386)">
    <text text-anchor="middle" font-family="'Inter', 'Montserrat', 'Segoe UI', -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="4">
      <tspan fill="#FFFFFF">MEMO</tspan><tspan fill="url(#pixGrad)">PIX</tspan>
    </text>
  </g>

  <!-- "5 TB CLOUD STORAGE" Subtitle -->
  <g transform="translate(256, 428)">
    <text text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="6" fill="#38BDF8">
      5 TB CLOUD STORAGE
    </text>
  </g>
</svg>